
name: Extract worm_ai ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP safely
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          archive = Path("worm_ai.zip")
          destination = Path("worm_ai_extracted")
          destination.mkdir(exist_ok=True)

          with ZipFile(archive) as z:
              for item in z.infolist():
                  target = (destination / item.filename).resolve()
                  if not target.is_relative_to(destination.resolve()):
                      raise ValueError(f"Unsafe ZIP path: {item.filename}")
              z.extractall(destination)

          print("Extraction completed.")
          PY

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worm_ai_extracted
          git diff --cached --quiet || git commit -m "Extract worm_ai.zip into repository"
          git push
